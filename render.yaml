services:
  - type: web
    name: medsage-backend
    env: node
    rootDir: server
    plan: free
    # Must be unauthenticated — /health is admin-only in production
    healthCheckPath: /healthz
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ─────────────────────────────────────────────────────────────────────
      # Add ALL of the following in your Render Dashboard under:
      #   Dashboard → medsage-backend → Environment → Environment Variables
      # ─────────────────────────────────────────────────────────────────────

      # Required — Supabase (data layer)
      # SUPABASE_URL                — Supabase project URL (https://xxx.supabase.co)
      # SUPABASE_PUBLISHABLE_KEY    — Supabase anon/publishable key (sb_publishable_...)
      # SUPABASE_SECRET_KEY         — Supabase service-role secret key (sb_secret_...)

      # Required — AI
      # GEMINI_API_KEY              — Google Gemini API key
      # GEMINI_MODEL                — gemini-2.5-flash  (optional, this is the default)
      # PLANNER_GEMINI_API_KEY      — Separate Gemini key for study planner (can be same as above)
      # PLANNER_GEMINI_MODEL        — gemini-2.5-flash  (optional)

      # Required — Google OAuth (server-side token verification)
      # GOOGLE_CLIENT_ID            — OAuth 2.0 client ID from Google Cloud Console

      # Required — Vector DB
      # QDRANT_URL                  — Qdrant Cloud cluster URL (https://xxx.qdrant.io)
      # QDRANT_API_KEY              — Qdrant Cloud API key

      # Required — Embeddings
      # HF_API_TOKEN                — HuggingFace API token
      # HF_EMBEDDING_MODEL          — BAAI/bge-large-en-v1.5  (optional, this is the default)

      # Required — CORS
      # ALLOWED_ORIGINS             — Comma-separated: https://medsage.pro,https://www.medsage.pro,https://medsage-ai.vercel.app

      # Optional — Fallback LLM (used when Gemini is unavailable)
      # FALLBACK_LLM_PROVIDER       — claude  (optional, claude is default)
      # FALLBACK_LLM_API_KEY        — Anthropic or OpenAI API key

      # Optional — Admin
      # ADMIN_UIDS                  — Comma-separated Google UIDs with admin access

      # Optional — Alerting
      # ALERT_WEBHOOK_URL           — Slack/Discord webhook for error-rate alerts
